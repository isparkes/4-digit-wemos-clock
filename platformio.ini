;**********************************************************************************
;* ESP8266 4-Digit Nixie Clock — PlatformIO build configuration                    *
;* Copyright (c) 2018-2026 Ian Sparkes. All rights reserved.                       *
;* Free for non-commercial use. See LICENSE in the repository root.                *
;**********************************************************************************
;
; Build:    pio run
; Flash:    pio run -t upload
; Monitor:  pio device monitor
; OTA:      pio run -e d1_mini_ota -t upload
;
; The firmware sources live in Software/ (set as src_dir below), so the hardware
; design in Hardware/ can sit alongside them in the same repository.

[platformio]
src_dir = Software
default_envs = d1_mini

[env:d1_mini]
platform  = espressif8266@4.2.1
board     = d1_mini
framework = arduino

; These reproduce the Arduino IDE board settings the firmware was developed with:
;   CPU 160 MHz / Flash 80 MHz / 4M flash with 1M SPIFFS / lwIP v2 higher bandwidth
board_build.f_cpu        = 160000000L
board_build.f_flash      = 80000000L
board_build.flash_mode   = dio
board_build.ldscript     = eagle.flash.4m1m.ld
board_build.filesystem   = spiffs

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
    ; The firmware stores its configuration in SPIFFS, which the ESP8266 core 3.x
    ; marks as deprecated in favour of LittleFS. Silence the notice until the
    ; storage layer in Software/SPIFFS.cpp is migrated.
    -Wno-deprecated-declarations

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default

; Pinned so a build in two years' time still produces the firmware you tested.
lib_deps =
    bblanchon/ArduinoJson @ ^5.13.2
    makuna/NeoPixelBus @ ^2.7.3
    paulstoffregen/Time @ ^1.6.1
    tzapu/WiFiManager @ ^0.16.0
    ; Unmaintained and not in the PlatformIO registry, so pinned to the exact
    ; commit that this firmware was built and tested against.
    https://github.com/me-no-dev/ESPAsyncUDP.git#697c75a0255e5dccf91b4ef8b5cc28c569b3bac9

; Over-the-air upload to an already-running clock.
;
; The firmware serves ESP8266HTTPUpdateServer at /update (see setup() in
; Software/main.cpp), which is a plain HTTP form upload, NOT the ArduinoOTA
; protocol that PlatformIO's "espota" uploader speaks. So the upload is a curl
; POST instead.
;
; Set CLOCK_HOST to the clock's IP address, or to the name shown as "Clock Name"
; on its web page followed by .local (the firmware registers mDNS under the
; ESP8266's default hostname, e.g. ESP_1A2B3C.local). The credentials are the
; ones set in setup(); change them there and here together.
[env:d1_mini_ota]
extends         = env:d1_mini
upload_protocol = custom
upload_command  = curl -f -u admin:update -F "image=@$SOURCE" http://${sysenv.CLOCK_HOST}/update
